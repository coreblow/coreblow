<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bright Orange Gradient for Body -->
    <linearGradient id="cb-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    
    <!-- Darker Orange Gradient for Tentacles -->
    <linearGradient id="cb-tentacle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    
    <!-- Soft Glow -->
    <radialGradient id="cb-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    /* Continuous floating for the whole octopus */
    .octopus {
      animation: float 4s ease-in-out infinite;
      transform-origin: center;
    }

    /* Wiggling tentacles */
    .tentacle-inner-l { animation: wiggle-left 3s ease-in-out infinite; transform-origin: 40px 70px; }
    .tentacle-inner-r { animation: wiggle-right 3.5s ease-in-out infinite; transform-origin: 80px 70px; }
    .tentacle-outer-l { animation: wiggle-left 4s ease-in-out infinite; transform-origin: 30px 65px; }
    .tentacle-outer-r { animation: wiggle-right 4.2s ease-in-out infinite; transform-origin: 90px 65px; }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    @keyframes wiggle-left {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }

    @keyframes wiggle-right {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }
  </style>

  <!-- Background Glow -->
  <circle cx="60" cy="45" r="45" fill="url(#cb-glow)"/>

  <g class="octopus">
    <!-- Tentacles Back -->
    <path class="tentacle-outer-l" d="M30 65 Q10 80 15 95 Q20 102 28 92 Q35 85 35 68Z" fill="url(#cb-tentacle)"/>
    <path class="tentacle-outer-r" d="M90 65 Q110 80 105 95 Q100 102 92 92 Q85 85 85 68Z" fill="url(#cb-tentacle)"/>

    <!-- Tentacles Front/Upwards (Like the picture) -->
    <path class="tentacle-inner-l" d="M38 68 Q15 65 20 40 Q25 25 35 45 Q38 52 42 62 Z" fill="url(#cb-tentacle)"/>
    <path class="tentacle-inner-r" d="M82 68 Q105 65 100 40 Q95 25 85 45 Q82 52 78 62 Z" fill="url(#cb-tentacle)"/>
    
    <!-- Tentacles Center (Bottom) -->
    <path d="M48 74 Q35 100 45 110 Q50 115 56 100 Q58 90 55 75Z" fill="url(#cb-tentacle)"/>
    <path d="M72 74 Q85 100 75 110 Q70 115 64 100 Q62 90 65 75Z" fill="url(#cb-tentacle)"/>
    <path d="M60 75 Q60 100 60 115 Q65 110 65 95 Q65 85 60 75Z" fill="url(#cb-tentacle)"/> <!-- Middle front -->

    <!-- Head / Body (Very round orange dome) -->
    <circle cx="60" cy="48" r="32" fill="url(#cb-body)"/>

    <!-- Body highlight (glossy reflection like the image) -->
    <path d="M35 35 Q45 25 55 23 Q40 30 38 45 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Open Happy Mouth -->
    <path d="M52 60 Q60 70 68 60 Q60 62 52 60" fill="#4c0519"/> <!-- Dark red back of mouth -->
    <path d="M56 64 Q60 68 64 64" fill="#fb7185"/> <!-- Pink tongue -->

    <!-- Left Eye (Big, Cute, Green Iris) -->
    <circle cx="44" cy="48" r="10" fill="#022c22"/> <!-- Dark green/black sclera -->
    <circle cx="46" cy="46" r="6" fill="#10b981"/> <!-- Green iris -->
    <circle cx="48" cy="44" r="3" fill="#ffffff"/> <!-- Main sparkle -->
    <circle cx="43" cy="50" r="1.5" fill="#ffffff"/> <!-- Mini sparkle -->

    <!-- Right Eye (Big, Cute, Green Iris matching left) -->
    <circle cx="76" cy="48" r="10" fill="#022c22"/> <!-- Dark green/black sclera -->
    <circle cx="74" cy="46" r="6" fill="#10b981"/> <!-- Green iris -->
    <circle cx="72" cy="44" r="3" fill="#ffffff"/> <!-- Main sparkle -->
    <circle cx="77" cy="50" r="1.5" fill="#ffffff"/> <!-- Mini sparkle -->

    <!-- Blush / Little cheek glow -->
    <ellipse cx="32" cy="56" rx="5" ry="3" fill="#ef4444" opacity="0.4"/>
    <ellipse cx="80" cy="54" rx="7" ry="4" fill="#ef4444" opacity="0.6"/> <!-- More pronounced blush under the wink -->
  </g>
</svg>
