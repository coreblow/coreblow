name = "super-scraper-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "super-scraper-db"
database_id = "YOUR_DATABASE_ID_HERE"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "super-scraper-storage"

[vars]
ENVIRONMENT = "production"
RATE_LIMIT_PER_MINUTE = "60"
CORS_ORIGIN = "*"
