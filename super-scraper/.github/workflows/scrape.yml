name: "🕷️ Super Scraper — Scheduled Run"

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      target_id:
        description: "Target ID to scrape (leave empty for all pending)"
        required: false
        type: string

env:
  WORKER_URL: ${{ secrets.WORKER_URL }}
  WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
  PROXY_URLS: ${{ secrets.PROXY_URLS }}

jobs:
  scrape:
    name: "🔄 Run Scraper"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "super-scraper/scraper/requirements.txt"

      - name: "📦 Install dependencies"
        run: |
          cd super-scraper/scraper
          pip install -r requirements.txt

      - name: "🎭 Install Playwright browsers"
        run: |
          cd super-scraper/scraper
          python -m playwright install chromium
          python -m playwright install-deps

      - name: "🕷️ Run scraper"
        run: |
          cd super-scraper/scraper
          if [ -n "${{ github.event.inputs.target_id }}" ]; then
            python main.py --target-id ${{ github.event.inputs.target_id }}
          else
            python main.py
          fi

      - name: "📊 Summary"
        if: always()
        run: |
          echo "## 🕷️ Scraping Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.inputs.target_id }}" ]; then
            echo "- **Target:** #${{ github.event.inputs.target_id }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Mode:** All pending jobs" >> $GITHUB_STEP_SUMMARY
          fi
