name: CoreBlow
options:
  bundleIdPrefix: com.coreblow
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_APP_INTENTS_METADATA_GENERATION: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 12

schemes:
  CoreBlow:
    shared: true
    build:
      targets:
        CoreBlow: all
    test:
      targets:
        - CoreBlowTests

targets:
  CoreBlow:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    entitlements:
      path: CoreBlow.entitlements
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreblow.app
        INFOPLIST_FILE: Info.plist
    dependencies:
      - target: CoreBlowActivityWidget
        embed: true
      - target: CoreBlowShareExtension
        embed: true

  CoreBlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CoreBlow

  CoreBlowActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ActivityWidget
    info:
      path: ActivityWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreblow.app.activity-widget

  CoreBlowShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreblow.app.share

  CoreBlowWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
    info:
      path: WatchApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreblow.app.watchkitapp
    dependencies:
      - target: CoreBlowWatchExtension
        embed: true

  CoreBlowWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    sources:
      - path: WatchExtension/Sources
    info:
      path: WatchExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreblow.app.watchkitextension
