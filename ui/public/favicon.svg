<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cb-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cb-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Plate -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Isometric Geometric Core Structure -->
  <polygon points="60,20 100,42 60,65 20,42" fill="url(#cb-top)"/>
  <polygon points="20,42 60,65 60,102 20,79" fill="url(#cb-grad)"/>
  <polygon points="100,42 60,65 60,102 100,79" fill="url(#cb-dark)"/>
  <!-- Central Pulse Core -->
  <circle cx="60" cy="62" r="8" fill="#38bdf8"/>
  <circle cx="60" cy="62" r="3" fill="#ffffff"/>
</svg>
