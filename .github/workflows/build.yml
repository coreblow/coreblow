# CoreBlow — Build Check
# Validates TypeScript compilation and declaration output
# Updated: 2026-04-24 — Single source tree (gateway/ removed)

name: CI — Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fadc5fa # v4.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build declarations
        run: npx tsc -p tsconfig.build.json

      - name: Verify dist output
        run: |
          count=$(find dist -name "*.d.ts" | wc -l)
          echo "Generated $count .d.ts files"
          if [ "$count" -lt 1000 ]; then
            echo "::error::Expected 1000+ .d.ts files, got $count"
            exit 1
          fi
          echo "✅ Build check passed"
