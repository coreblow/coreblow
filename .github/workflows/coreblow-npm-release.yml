name: CoreBlow NPM Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v2.3.1)
        required: true
        type: string
      preflight_only:
        description: Run validation/build only and skip the gated publish job
        required: true
        default: false
        type: boolean

concurrency:
  group: coreblow-npm-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.x"

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate SemVer tag format
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Invalid SemVer release tag format: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Checkout selected tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify runtime artifacts
        run: |
          set -euo pipefail
          pnpm build
          test -f dist/entry.js
          test -f dist/control-ui/index.html

      - name: Verify release sync
        run: node scripts/check-release-sync.mjs
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      - name: Run tests
        run: pnpm test
        env:
          CI: true
          COREBLOW_TEST_PROFILE: serial
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Validate package metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag ${RELEASE_TAG} is not contained in origin/main"
            exit 1
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          PKG_NAME=$(node -p "require('./package.json').name")
          echo "Package: $PKG_NAME@$PKG_VERSION"

      - name: Ensure version is not already published
        env:
          PREFLIGHT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_only || 'false' }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "coreblow@${PKG_VERSION}" version >/dev/null 2>&1; then
            if [[ "${PREFLIGHT_ONLY}" == "true" ]]; then
              echo "coreblow@${PKG_VERSION} is already published on npm; continuing because preflight_only=true."
              exit 0
            fi
            echo "::error::coreblow@${PKG_VERSION} is already published on npm."
            exit 1
          fi
          echo "coreblow@${PKG_VERSION} is not published yet."

      - name: Verify tarball hygiene and dry-run publish
        run: |
          set -euo pipefail
          DRY_PACK=$(npm pack --dry-run 2>&1)
          echo "$DRY_PACK" | tail -n 15
          if echo "$DRY_PACK" | grep -E "npm notice .* src/.*\.ts$"; then
            echo "::error::Tarball hygiene failure: src/**/*.ts leaked into package"
            exit 1
          fi
          if echo "$DRY_PACK" | grep -E "npm notice .*\.test\.d\.ts$"; then
            echo "::error::Tarball hygiene failure: *.test.d.ts leaked into package"
            exit 1
          fi
          npm publish --dry-run

  validate_publish_dispatch_ref:
    if: github.event_name == 'push' || inputs.preflight_only != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main workflow ref for manual publish dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${WORKFLOW_REF}" != "refs/heads/main" ]]; then
            echo "Real publish runs must be dispatched from main. Use preflight_only=true for branch validation."
            exit 1
          fi

  publish:
    needs: [preflight, validate_publish_dispatch_ref]
    if: github.event_name == 'push' || inputs.preflight_only != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm-publish
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          NPM_VERSION=$(npm --version)
          echo "Active npm version: ${NPM_VERSION}"
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            if (maj < 11 || (maj === 11 && min < 5) || (maj === 11 && min === 5 && pat < 1)) {
              console.error("npm >= 11.5.1 is required for OIDC Trusted Publishing, got", process.argv[1]);
              process.exit(1);
            }
          ' "${NPM_VERSION}"

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Determine npm dist-tag
        id: npm-tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *"-beta."* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_TAG" =~ -(alpha|rc)\. ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm via OIDC Trusted Publishing
        run: |
          echo "OIDC request URL present: $([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
          npm publish --tag "${{ steps.npm-tag.outputs.tag }}" --provenance --access public --loglevel=verbose
