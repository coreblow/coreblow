# CoreBlow — Security Audit
# Updated: 2026-04-24 — Single source tree (gateway/ removed)

name: CI — Security Audit

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
  schedule:
    - cron: '0 6 * * MON' # Weekly Monday 6am

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --prod || true

      - name: Security pattern scan
        run: |
          echo "=== Checking for dangerous patterns ==="
          FAIL=0

          echo "Checking raw eval()..."
          if ! node scripts/check-no-raw-eval.mjs; then
            FAIL=1
          else
            echo "✅ No raw eval() calls"
          fi

          echo "Checking for hardcoded secrets..."
          SECRET_HITS=$(grep -rn "sk-[a-zA-Z0-9]\{20,\}\|AKIA[A-Z0-9]\{16\}" src --include='*.ts' | grep -v test || true)
          SECRET_COUNT=$(printf '%s\n' "$SECRET_HITS" | grep -c . || true)
          if [ "$SECRET_COUNT" != "0" ]; then
            echo "❌ Found $SECRET_COUNT potential hardcoded secrets"
            FAIL=1
          else
            echo "✅ No hardcoded secrets"
          fi

          echo "Checking for unsanitized exec()..."
          EXEC_UNSAFE=$(grep -rn "execSync\|exec(" src --include='*.ts' | grep -v test | grep -c "\${" || true)
          echo "⚠️  $EXEC_UNSAFE exec() calls with template literals (review needed)"

          exit "$FAIL"

      - name: Security test suite
        run: pnpm test:security
        env:
          CI: true
