# CoreBlow — Bun Compatibility Check
# Updated: 2026-04-24 — Single source tree (gateway/ removed)

name: Bun CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

jobs:
  bun-test:
    name: Bun Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        bun-version: ['1.1', '1.2']
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - run: pnpm install --frozen-lockfile
      - run: bun run typecheck
      - name: Bun CLI smoke
        run: timeout --kill-after=30s 60s bun run src/cli/init.ts --help >/dev/null

  bun-bench:
    name: Bun Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: bun-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2'

      - run: pnpm install --frozen-lockfile
      - name: Startup Time
        run: |
          echo "Measuring cold-start time..."
          time bun run src/cli/init.ts --help 2>/dev/null || true
