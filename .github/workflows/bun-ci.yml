# CoreBlow — Bun Compatibility Check
# Updated: 2026-04-24 — Single source tree (gateway/ removed)

name: Bun CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

jobs:
  bun-test:
    name: Bun Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        bun-version: ['1.1', '1.2']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: pnpm

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - run: pnpm install --frozen-lockfile
      - run: bun run typecheck
      - name: Bun CLI smoke
        run: timeout --kill-after=30s 60s bun run src/cli/init.ts --help >/dev/null

  bun-bench:
    name: Bun Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: bun-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: pnpm

      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2
        with:
          bun-version: '1.2'

      - run: pnpm install --frozen-lockfile
      - name: Startup Time
        run: |
          echo "Measuring cold-start time..."
          time bun run src/cli/init.ts --help 2>/dev/null || true
