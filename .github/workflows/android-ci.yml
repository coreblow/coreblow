name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android/**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew :app:assemblePlayDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testPlayDebugUnitTest --no-daemon

      - name: Upload APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: coreblow-android-debug
          path: apps/android/app/build/outputs/apk/play/debug/*.apk
          retention-days: 14
