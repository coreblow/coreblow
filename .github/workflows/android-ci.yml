name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/android/**"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/android/**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew :app:assemblePlayDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testPlayDebugUnitTest --no-daemon

      - name: Upload APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.0
        with:
          name: coreblow-android-debug
          path: apps/android/app/build/outputs/apk/play/debug/*.apk
          retention-days: 14
