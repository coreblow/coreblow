# CoreBlow — Unit Tests
# Sharded 4-way parallel CI execution

name: CI — Unit Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests (${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shards: [4]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test
        env:
          CI: true
          COREBLOW_TEST_PROFILE: serial
          COREBLOW_TEST_SHARDS: ${{ matrix.shards }}
          COREBLOW_TEST_SHARD_INDEX: ${{ matrix.shard }}
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Publish Test Results
        if: always()
        run: echo "Unit tests shard ${{ matrix.shard }}/${{ matrix.shards }} completed"
