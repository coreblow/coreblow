# CoreBlow — Unit Tests
# Updated: 2026-04-24 — Single source tree (gateway/ removed)

name: CI — Unit Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test
        env:
          CI: true
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Publish Test Results
        if: always()
        run: echo "Tests completed"
