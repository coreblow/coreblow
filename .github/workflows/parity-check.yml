# CoreBlow — Parity Check
# Verifies architectural parity baseline
# Updated: 2026-04-24 — Single source tree (gateway/ removed)

name: Parity Check

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Level 1-2: File & Export Parity ───────────────────────────────────────
  parity-audit:
    name: "L1-2: File & Export Parity"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run parity audit
        run: |
          node scripts/audit-oc-parity.mjs --json > /tmp/parity.json 2>/dev/null || true
          if [ -f /tmp/parity.json ] && [ -s /tmp/parity.json ]; then
            node -e "
              const d = JSON.parse(require('fs').readFileSync('/tmp/parity.json','utf8'));
              const exportGaps = d.exports?.gaps?.length ?? 0;
              console.log('Export gaps:', exportGaps);
              if (exportGaps > 0) {
                console.error('WARN: Export API gaps detected');
                d.exports.gaps.forEach(g => {
                  console.error(' FILE:', g.file);
                  g.missing_in_cb?.forEach(fn => console.error('  -', fn));
                });
              }
              console.log('✅ Level 1-2: Parity audit completed');
            "
          else
            echo "⚠️ Parity audit script not available (reference baseline not present in CI)"
          fi

  # ── Level 3: Behavior Tests ───────────────────────────────────────────────
  behavior-tests:
    name: "L3: Behavior Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test
        env:
          CI: true
          COREBLOW_TEST_PROFILE: serial
          NODE_OPTIONS: '--max-old-space-size=4096'

  # ── Level 5: Contract Tests ────────────────────────────────────────────────
  contract-tests:
    name: "L5: Contract Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: behavior-tests
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run contract tests
        run: pnpm test:contracts
        env:
          CI: true

  # ── Level 4: Benchmarks (non-blocking, informational only) ────────────────
  benchmarks:
    name: "L4: Benchmarks (informational)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: behavior-tests
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        run: pnpm bench 2>&1 || true
        env:
          CI: true

  # ── Summary ────────────────────────────────────────────────────────────────
  parity-summary:
    name: "Parity Summary"
    runs-on: ubuntu-latest
    needs: [parity-audit, behavior-tests, contract-tests]
    if: always()
    steps:
      - name: Summary
        run: |
          {
            echo "## CoreBlow Parity Check Results"
            echo ""
            echo "| Level | Name | Status |"
            echo "|-------|------|--------|"
            echo "| L1-2 | File & Export Parity | ${{ needs.parity-audit.result == 'success' && '✅' || '⚠️' }} |"
            echo "| L3   | Behavior Tests | ${{ needs.behavior-tests.result == 'success' && '✅' || '❌' }} |"
            echo "| L5   | Contract Tests | ${{ needs.contract-tests.result == 'success' && '✅' || '❌' }} |"
            echo "| L4   | Benchmarks | ⚠️ informational |"
          } >> "$GITHUB_STEP_SUMMARY"
