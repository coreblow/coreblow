name: Stale Issue Management
on:
  schedule:
    - cron: '0 0 * * 1' # Monday midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.
            If this issue is still relevant, please comment to keep it open.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.
          close-issue-message: 'This issue was closed because it has been stale for 14 days.'
          close-pr-message: 'This PR was closed because it has been stale for 7 days.'
          days-before-stale: 30
          days-before-close: 14
          days-before-pr-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,bug,P0,P1'
          exempt-pr-labels: 'pinned,security,P0'
          operations-per-run: 100
