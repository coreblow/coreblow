# CoreBlow Gateway — CI/CD Pipeline
# Runs the full test suite on every push and PR

name: Gateway CI

on:
  push:
    branches: [main, develop]
    paths: ['gateway/**']
  pull_request:
    branches: [main]
    paths: ['gateway/**']

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gateway

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: npx vitest run src/ --reporter=verbose

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

  lint:
    name: Lint & Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for :any types
        run: |
          count=$(grep -rn ": any" src --include="*.ts" | grep -v test | grep -v node_modules | grep -v ".d.ts" | wc -l)
          echo "Found $count :any types in source"
          if [ "$count" -gt 5 ]; then
            echo "::error::Too many :any types ($count). Target: <5"
            exit 1
          fi

      - name: Check for @ts-nocheck
        run: |
          count=$(grep -rl "@ts-nocheck" src --include="*.ts" | grep -v test | grep -v node_modules | wc -l)
          echo "Found $count @ts-nocheck files in source"
          if [ "$count" -gt 0 ]; then
            echo "::error::@ts-nocheck found in $count source files. Must be 0."
            exit 1
          fi

      - name: Check for empty files
        run: |
          count=$(find src -name "*.ts" -empty | wc -l)
          echo "Found $count empty .ts files"
          if [ "$count" -gt 0 ]; then
            echo "::error::Found $count empty .ts files"
            exit 1
          fi
