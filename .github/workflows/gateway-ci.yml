# CoreBlow Gateway — CI/CD Pipeline
# Runs the full test suite on every push and PR
# Updated: 2026-04-24 — Single source tree (gateway/ removed)

name: Gateway CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'extensions/**'
      - 'packages/**'
      - 'scripts/test-*.mjs'
      - 'scripts/test-planner/**'
      - 'test/vitest/vitest.gateway.config.ts'
      - '.github/workflows/gateway-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'extensions/**'
      - 'packages/**'
      - 'scripts/test-*.mjs'
      - 'scripts/test-planner/**'
      - 'test/vitest/vitest.gateway.config.ts'
      - '.github/workflows/gateway-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  test:
    name: Test Suite (${{ matrix.gateway-shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
        gateway-shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run gateway tests
        run: pnpm test:gateway
        env:
          CI: true
          COREBLOW_TEST_PROFILE: serial
          COREBLOW_TEST_SHARDS: 3
          COREBLOW_TEST_SHARD_INDEX: ${{ matrix.gateway-shard }}
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Type check
        run: pnpm typecheck

      - name: Build declarations
        run: npx tsc -p tsconfig.build.json

  lint:
    name: Lint & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Check for @ts-nocheck
        run: |
          baseline=15
          count=$(grep -rl "@ts-nocheck" src --include="*.ts" | grep -v test | grep -v node_modules | grep -c . || true)
          echo "Found $count @ts-nocheck files in source"
          if [ "$count" -gt "$baseline" ]; then
            echo "::error::@ts-nocheck source baseline grew from $baseline to $count."
            exit 1
          fi
          if [ "$count" -lt "$baseline" ]; then
            echo "::notice::@ts-nocheck source baseline improved from $baseline to $count. Update the baseline."
          fi

      - name: Check for empty files
        run: |
          count=$(find src -name "*.ts" -empty | wc -l)
          echo "Found $count empty .ts files"
          if [ "$count" -gt 0 ]; then
            echo "::error::Found $count empty .ts files"
            exit 1
          fi
