# CoreBlow — Lint & Type Check
# Updated: 2026-04-24 — Single source tree (gateway/ removed)

name: CI — Lint & Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (oxlint)
        run: pnpm lint
        continue-on-error: true

      - name: Check for raw eval()
        run: "! grep -rn 'eval(' src --include='*.ts' | grep -v 'test\\|safeEvaluateMath\\|sanitize\\|vm\\|\\.eval\\b\\|//\\|/\\*'"

      - name: Check for empty catch blocks
        run: "! grep -rn 'catch\\s*{\\s*}' src --include='*.ts' | grep -v 'intentionally'"
        continue-on-error: true
