# CoreBlow — Lint & Type Check
# Updated: 2026-04-24 — Single source tree (gateway/ removed)

name: CI — Lint & Type Check

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (oxlint)
        run: pnpm lint
        continue-on-error: true

      - name: Check for raw eval()
        run: node scripts/check-no-raw-eval.mjs

      - name: Check for empty catch blocks
        run: "! grep -rn 'catch\\s*{\\s*}' src --include='*.ts' | grep -v 'intentionally'"
        continue-on-error: true
