name: "Detect Docs Changes"
description: "Check if docs/ files were modified"
outputs:
  docs-changed:
    description: "Whether docs were changed"
    value: ${{ steps.check.outputs.changed }}
runs:
  using: "composite"
  steps:
    - id: check
      shell: bash
      run: |
        if git diff --name-only HEAD~1 | grep -q '^docs/'; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
