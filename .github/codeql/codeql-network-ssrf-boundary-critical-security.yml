name: coreblow-codeql-network-ssrf-boundary-critical-security

disable-default-queries: true

queries:
  - uses: security-extended

query-filters:
  - include:
      precision:
        - high
        - very-high
      tags contain: security
      security-severity: /([7-9]|10)\.(\d)+/

paths:
  - src/infra/net
  - src/infra/outbound
  - src/shared/net
  - src/web
  - src/web-search
  - src/link-understanding
  - src/media-understanding
  - src/plugin-sdk/ssrf-policy.ts
  - src/plugin-sdk/ssrf-runtime.ts
  - packages/memory-host-sdk/src/host/remote-http.ts

paths-ignore:
  - "**/node_modules"
  - "**/coverage"
  - "**/*.generated.ts"
  - "**/*.bundle.js"
  - "**/*-runtime.js"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.e2e.test.ts"
  - "**/*.e2e.test.tsx"
  - "**/*test-support*"
  - "**/*test-helper*"
  - "**/*mock*"
  - "**/*fixture*"
  - "**/*bench*"
