name: "CoreBlow CodeQL JavaScript/TypeScript"
paths:
  - src
  - extensions
paths-ignore:
  - apps
  - docs
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.gradle/**"
  - "**/coverage/**"
  - vendor/**
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test.js"
  - "**/*.test.jsx"
  - "**/*.e2e.test.ts"
  - "**/*.e2e.test.tsx"
