name: coreblow-codeql-core-auth-secrets-critical-security

disable-default-queries: true

queries:
  - uses: security-extended

query-filters:
  - include:
      precision:
        - high
        - very-high
      tags contain: security
      security-severity: /([7-9]|10)\.(\d)+/

paths:
  - src/auth
  - src/secrets
  - src/security
  - src/config
  - src/gateway
  - src/infra
  - src/agents/auth-profiles
  - src/agents/sandbox
  - src/agents/sandbox.ts
  - src/agents/bash-tools.exec-host-shared.ts
  - src/cron/service/jobs.ts
  - src/cron/stagger.ts

paths-ignore:
  - "**/node_modules"
  - "**/coverage"
  - "**/*.generated.ts"
  - "**/*.bundle.js"
  - "**/*-runtime.js"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.e2e.test.ts"
  - "**/*.e2e.test.tsx"
  - "**/*test-support*"
  - "**/*test-helper*"
  - "**/*mock*"
  - "**/*fixture*"
  - "**/*bench*"
