name: Scrape Single Target
on:
  workflow_dispatch:
    inputs:
      target_id:
        description: "Target ID to scrape"
        required: true
        type: number
      dry_run:
        description: "Dry run (don't post results to API)"
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ultra-skills/scraper
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run scraper for target
        working-directory: ultra-skills/scraper
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          ARGS="--target-id ${{ inputs.target_id }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python main.py $ARGS
