services:
  - type: web
    name: coreblow
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: COREBLOW_GATEWAY_PORT
        value: "8080"
      - key: COREBLOW_STATE_DIR
        value: /data/.coreblow
      - key: COREBLOW_WORKSPACE_DIR
        value: /data/workspace
      - key: COREBLOW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: coreblow-data
      mountPath: /data
      sizeGB: 1
